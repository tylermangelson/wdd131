<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request - TMF Agents</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <img src="images/logos/tmfAgentsLogoNoBackground.png" alt="TMF Agents Logo">
            <button class="menu-btn">
                <span></span><span></span><span></span>
            </button>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="agents.html">Agents</a>
                <a href="request.html">Request</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>Request a Custom Agent</h1>
        <p>Don't see an agent that fits your needs? Fill out the form below and we'll build one for you!</p>

        <form class="request-form" method="POST">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="First Last" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="username@email.com" required>

            <label for="agent-name">Agent Name / Topic</label>
            <input type="text" id="agent-name" name="agent-name" placeholder="Give the agent a cool name" required>

            <label for="description">What should the agent do?</label>
            <textarea id="description" name="description" rows="5"
                placeholder="Describe the cool things you want the agent to do" required></textarea>

            <button type="submit">Submit Request</button>
        </form>
    </main>

    <footer>&copy; 2026 TMF Agents - Tyler Mangelson</footer>

    <script src="script.js"></script>
</body>

</html>
